. ასაკი — ჯერ გადასაწყვეტი პოლიტიკა",paragraphs:["რეკომენდებულია, პირველი კონტროლირებადი პილოტი მხოლოდ სრულწლოვან მონაწილეებზე იყოს გათვლილი. ეს არის რეკომენდაცია და არა მტკიცება, რომ სისტემა ასაკს ამოწმებს: ასაკის დადასტურებისა და მშობლის/კანონიერი წარმომადგენლის თანხმობის პროცედურა ამ დემოსთვის არ არის დანერგილი. არასრულწლოვანთა ჩართვამდე საჭიროა ცალკე სამართლებრივი შეფასება, შესაბამისი შეტყობინებები და რეალური სამუშაო პროცედურა."]},{heading:"4. სასწავლო მასალა და შედეგები",paragraphs:["დემო ინსტრუქტორები და მათზე წარმოდგენილი პროფილები გამოგონილია; დემო კურსები და ტექნიკური სანიმუშო ვიდეოები რეალური სრული სასწავლო პროგრამის შეთავაზებად არ უნდა აღიქმებოდეს. დემო ნიშნული უნდა შენარჩუნდეს მათ ჩვენებასთან ერთად. აქ არ არის რეალური მომხმარებლების შეფასებები ან რეიტინგები.","არ გაიცემა დასაქმების, შემოსავლის, გამოცდის ჩაბარების ან კონკრეტული პროფესიული შედეგის გარანტია. დემო არ აცხადებს სახელმწიფო აკრედიტაციას და არ გასცემს აღიარებულ კვალიფიკაციას ან სერტიფიკაციას; პროგრესის ან დასრულების აღნიშვნა ასეთი დოკუმენტი არ არის. ეს განმარტება არ ზღუდავს მომსახურების ნამდვილ აღწერასთან შესაბამისობის კანონიერ მოთხოვნას."]},{heading:"5. ჩარიცხვა, ფასი და გადახდა",paragraphs:["ამ დემოში ხელმისაწვდომია უფასო ჩარიცხვა. ფასიანი ნიმუშების ფასები ლარში მხოლოდ საინფორმაციოა; მათი შეძენა და გადახდა გამორთულია. ბარათის მონაცემებს ნუ მოგვაწვდით. არც გამოწერა და არც ავტომატური ჩამოჭრა არ შემოთავაზდება.","გაყიდვების შესაძლო ჩართვამდე უნდა განისაზღვროს, მომხმარებლის ხელშეკრულების მხარე და თანხის მიმღები ოპერატორი იქნება თუ ინსტრუქტორი, და ვინ შეასრულებს მიწოდების, საჩივრისა და დაბრუნების ვალდებულებებს. რეალურ შეკვეთამდე გამოსაჩენი იქნება სრული ფასი ლარში, გადასახადებისა და სავალდებულო ხარჯების ჩათვლით, წვდომის ვადა, ტექნიკური მოთხოვნები, გადახდის საშუალება და უარის თქმის პირობები. ეს მომავალი მოთხოვნებია და არა მოქმედი გადახდის ფუნქციები."]},{heading:"6. მასალის გამოყენების ფარგლები",paragraphs:["კანონით ნებადართული გამოყენების გარდა, მასალა განკუთვნილია პირადი სწავლისთვის, მინიჭებული წვდომის ფარგლებში; ჩარიცხვა არ გადასცემს მასალაზე საავტორო უფლებას. მესამე პირისთვის გაყიდვა, საჯაროდ ხელახლა ატვირთვა ან სხვისად გასაღება საჭირო ნებართვის გარეშე აკრძალულია. ავტორის კანონით დაცული უფლებები და გამოყენების კანონიერი გამონაკლისები ძალაში რჩება.","საჯარო წინასწარი სანახავი ვიდეოს გარდა, გაკვეთილის წვდომა შეიძლება ანგარიშსა და ჩარიცხვაზე იყოს დამოკიდებული. წვდომის ტექნიკური კონტროლი არ ნიშნავს სრულ დაცვას კოპირებისგან: DRM-იც ვერ გამორიცხავს ეკრანის ჩაწერას. „სამუდამო წვდომა“ ამ დემოთი არ არის დაპირებული; რეალური კურსისთვის წვდომის ზუსტი ხანგრძლივობა წინასწარ უნდა განისაზღვროს."]},{heading:"7. მოდერაცია და წვდომის შეზღუდვა",paragraphs:["დემო ითვალისწინებს ინსტრუქტორის მონახაზის, ატვირთვისა და ოპერატორის ადგილობრივი განხილვის პროცესს. წარმოდგენა არ ნიშნავს ავტომატურ გამოქვეყნებას ან ხარისხის/უფლებების სამართლებრივ დამოწმებას. დაუშვებელია უკანონო, მავნე, დისკრიმინაციული ან სხვისი საავტორო და პირადი უფლებების დამრღვევი მასალის ატვირთვა.","სავარაუდო დარღვევის ან უსაფრთხოების საფრთხისას შესაძლოა საჭირო გახდეს მასალის ან წვდომის დროებითი შეზღუდვა. რეალურ სერვისში საჭიროა დასაბუთებული გადაწყვეტილება, შესაძლებლის ფარგლებში შეტყობინება და გადახედვის არხი; სასწრაფო დაცვითი ზომა ამ მოთხოვნებს მუდმივად არ ანაცვლებს. შეზღუდვა არ აუქმებს კანონით არსებულ მოთხოვნას ან მომხმარებლის დაბრუნების უფლებას."]},{heading:"8. შეფერხება, ცვლილებები და მომხმარებლის უფლებები",paragraphs:["ლოკალურ დემოს შეიძლება ჰქონდეს შეფერხება, საცდელი მონაცემების განულება ან ფუნქციის შეცვლა; ნუ გამოიყენებთ მას ერთადერთ საცავად ან რეალური ფასიანი სწავლების მიწოდებისთვის. ეს გაფრთხილება არ არის პასუხისმგებლობის სრული გამორიცხვა და არ ამცირებს კანონით სავალდებულო მომხმარებლის უფლებებს.","საჯარო სერვისისთვის არსებითი პირობების ცვლილება უნდა ეცნობოს მომხმარებელს, შენარჩუნდეს მიღებული ტექსტის ვერსია და, საჭიროებისას, მიღებულ იქნეს ახალი შეთანხმება. მხოლოდ გვერდის რედაქტირებით უკვე დადებული ხელშეკრულება მომხმარებლის საზიანოდ არ უნდა შეიცვალოს."]},{heading:"9. საჩივარი და სამართლებრივი დაცვა",paragraphs:["ოპერატორის რეალური საჩივრების მისამართი და ელფოსტა ჯერ არ არის მოწოდებული; ამ პროექტში არ არის დასრულებული საჯარო მხარდაჭერის არხი. ადგილობრივ ტესტში საკითხი გადაეცით დემოს გამშვებ პირს. საჯარო გაშვებამდე უნდა გამოქვეყნდეს მოქმედი არხი და მოთხოვნის მიღების, განხილვისა და პასუხის პროცედურა.","არც ეს ტექსტი და არც შიდა განხილვა არ გართმევთ სასამართლოსთვის ან კომპეტენტური ორგანოსთვის მიმართვის უფლებას. მომხმარებლის უფლებების საკითხებზე უფლებამოსილი ორგანოა საქართველოს კონკურენციისა და მომხმარებლის დაცვის სააგენტო; მისი კომპეტენცია და კონკრეტული მოთხოვნის სამართლებრივი გზა შესაბამისი კანონით განისაზღვრება."]}]},privacy:{title:"კონფიდენციალურობის ინფორმაცია — DRAFT",intro:mc,sections:[{heading:"1. პასუხისმგებელი პირი და ამ ინფორმაციის ფარგლები",paragraphs:[vc,"მონაცემთა დამუშავებისთვის პასუხისმგებელი რეალური პირის სახელი/სახელწოდება, საიდენტიფიკაციო მონაცემები, მისამართი და საკონტაქტო არხი ჯერ არ არის მოწოდებული. მათი შევსებისა და ქვემოთ აღწერილი წესების რეალურ სისტემასთან შემოწმების გარეშე ეს არ არის საჯარო სერვისისთვის დასრულებული კონფიდენციალურობის შეტყობინება."]},{heading:"2. მონაცემები და მიზნები",paragraphs:["დემოს ანგარიშისთვის განსაზღვრულია სახელი, ელფოსტა, პაროლის scrypt-ჰეში, სესიის ტოკენის ჰეში და პირობების მიღებასთან დაკავშირებული დროითი ჩანაწერები. ასევე მუშავდება ჩარიცხვა და გაკვეთილების დასრულების პროგრესი. ჰეში მონაცემთა ანონიმიზაციას არ ნიშნავს; ანგარიშთან დაკავშირებული ჩანაწერები პერსონალურ მონაცემებად რჩება.","ინსტრუქტორის რეჟიმში ემატება მონახაზი, კურსისა და გაკვეთილის აღწერა, ატვირთული MP4, მოდერაციის სტატუსი და ინსტრუქტორის პირობების მიღების ჩანაწერი. ვიდეოში ან აღწერაში ნუ ჩართავთ სხვა პირის გამოსახულებას, ხმას ან პირად ინფორმაციას შესაბამისი სამართლებრივი საფუძვლის გარეშე. არ ატვირთოთ რეალური კონფიდენციალური დოკუმენტები.","სერვერს მოთხოვნის დამუშავებისას ტექნიკურად მიეწოდება ქსელური ინფორმაცია, მაგალითად IP მისამართი. რომელი ტექნიკური ჟურნალები ინახება და რამდენ ხანს, ცალკე შესამოწმებელია გაშვებამდე; არ ვაცხადებთ, რომ ქსელური მონაცემები საერთოდ არ მუშავდება. პირადი ნომერი, დაბადების თარიღი, ბარათის მონაცემები და განსაკუთრებული კატეგორიის მონაცემები ამ დემოს მიზნებისთვის საჭირო არ არის."]},{heading:"3. სამართლებრივი საფუძვლები — ყველაფერი თანხმობა არ არის",paragraphs:["ანგარიშის შექმნისა და მოთხოვნილი სასწავლო წვდომის, ჩარიცხვისა და პროგრესის შენარჩუნებისთვის აუცილებელი მონაცემების შესაბამისი საფუძველია მომხმარებლის მოთხოვნით გარიგების დადება ან ნაკისრი ვალდებულებების შესრულება. საჭირო ანგარიშის მონაცემების არმიწოდებისას პერსონალური ანგარიშისა და პროგრესის მიწოდება ვერ მოხერხდება; არ არის საჭირო არჩევითი მონაცემების ძალით მოთხოვნა.","მინიმალური უსაფრთხოების ჩანაწერები და ბოროტად გამოყენების პრევენცია შეიძლება ემყარებოდეს მნიშვნელოვან ლეგიტიმურ ინტერესს მხოლოდ აუცილებლობის, თანაზომიერებისა და პირის უფლებებთან დაბალანსების დასაბუთების შემდეგ. კანონით აუცილებელი ჩანაწერების შენახვა ემყარება შესაბამის სამართლებრივ ვალდებულებას, არა უსასრულო შენახვის ზოგად საბაბს.","პირობების მიღება და მისი დროის შენახვა არ არის თანხმობა ყველა შესაძლო მონაცემის დამუშავებაზე. არჩევითი თანხმობა უნდა იყოს თავისუფალი, კონკრეტული, ინფორმირებული და გამოსახმობი. მარკეტინგი ამ დემოში არ ხდება; მომავალი მარკეტინგისთვის, თუ საერთოდ დაიგეგმება, საჭიროა ცალკე კანონიერი თანხმობა და მარტივი უარის მექანიზმი, არა ანგარიშის სავალდებულო პირობა."]},{heading:"4. მხოლოდ აუცილებელი cookie-ები",paragraphs:["დემოში cookie გამოიყენება ანგარიშის სესიისა და აუცილებელი ავტორიზაციისთვის. მისი დაბლოკვისას ანგარიშით სარგებლობა შეიძლება ვერ მოხერხდეს. ეს არ არის სარეკლამო თვალთვალი ან სხვადასხვა საიტზე მომხმარებლის პროფილის აგება.","არ არის ჩართული ანალიტიკა, სარეკლამო ტრეკერები ან არჩევითი მარკეტინგული cookie-ები. ამიტომ არ გთავაზობთ მოჩვენებით „ყველაფერზე თანხმობის“ ბანერს. ახალი არასავალდებულო ტექნოლოგიის დამატებამდე საჭიროა ინვენტარისა და შეტყობინების განახლება და შესაბამისი არჩევანის რეალური მექანიზმი; ამ ტექსტით წინასწარი თანხმობა არ გაიცემა."]},{heading:"5. შენახვის ადგილი, წვდომა და მიმღებები",paragraphs:["აღწერილი საცდელი კონფიგურაცია იყენებს ადგილობრივ SQLite ბაზასა და ადგილობრივ, საჯარო საქაღალდის გარეთ შენახულ ვიდეოფაილებს. დემო საჯაროდ არ არის განთავსებული. პროექტს არ ჰყავს შერჩეული გადახდის, ანალიტიკის, რეკლამის ან ელფოსტის გაგზავნის პროვაიდერი და ამ მიზნებისთვის მონაცემთა გადაცემა არ არის ჩართული.","მონაცემებზე წვდომა შეიძლება დასჭირდეს დემოს გამშვებ პირს მხოლოდ ტესტის, მხარდაჭერისა და მოდერაციისთვის. ვინ არის ეს უფლებამოსილი პირი და როგორ კონტროლდება მისი წვდომა, გაშვებამდე უნდა დაფიქსირდეს. მონაცემები არ უნდა გაიყიდოს ან გამოყენებულ იქნეს დაუდგენელი სარეკლამო მიზნებისთვის.","მომავალი ჰოსტინგის, სარეზერვო ასლებისა და ტექნიკური მხარდაჭერის პროვაიდერები და ქვეყნები ჯერ არ არის შერჩეული. უცხოეთში ჰოსტინგი ან უცხოეთიდან ადმინისტრაციული წვდომა საჭიროებს ცალკე შეფასებას, მონაცემთა დამუშავების წერილობით შეთანხმებებსა და გადაცემის შესაბამის გარანტიებს; ზოგ შემთხვევაში საჭიროა ზედამხედველი ორგანოს ნებართვაც. მხოლოდ „ღრუბელი უსაფრთხოა“ ან საერთო პირობებზე თანხმობა საკმარისი არ არის."]},{heading:"6. შენახვის ვადები — დროებითი გეგმა, არა ავტომატიკა",paragraphs:["სატესტო ანგარიშისა და პროგრესის საჭიროება უკავშირდება კონკრეტულ ადგილობრივ ტესტს; საცდელი მონაცემები უნდა გადაიხედოს ტესტის დასრულებისას და წაიშალოს, როცა საჭირო აღარ არის. მონახაზისა და ვიდეოსთვის უნდა შეფასდეს განხილვისა და შეთანხმებული წვდომის საჭიროება; სესიის ჩანაწერისთვის — ავტორიზაციის მოქმედება და გაუქმება.","ზუსტი კალენდარული ვადები, სარეზერვო ასლებიდან წაშლის ციკლი და კანონით აუცილებელი გამონაკლისები ჯერ არ არის დამტკიცებული. ავტომატური წაშლის სისტემა დანერგილად არ არის გამოცხადებული: მიმდინარე ტესტის მონაცემების წაშლა/ექსპორტი საჭიროებს ოპერატორის ხელით შესრულებასა და შედეგის შემოწმებას. საჯარო გაშვებამდე უნდა დამტკიცდეს ვადების ცხრილი, პასუხისმგებელი პირი და შესრულების პროცედურა; დაუდგენელი ვადა უსასრულო შენახვის ნებართვა არ არის."]},{heading:"7. თქვენი უფლებები და მოთხოვნის რეალური გზა",paragraphs:["კანონით გათვალისწინებული პირობებით შეგიძლიათ მიიღოთ ინფორმაცია და ასლი, მოითხოვოთ გასწორება, დამუშავების შეწყვეტა, წაშლა ან დაბლოკვა და, შესაბამის შემთხვე ს შემოთავაზებული ფარგლები",paragraphs:["საავტორო უფლება რჩება ავტორს ან სხვა კანონიერ უფლებამფლობელს. შემოთავაზებულია არაექსკლუზიური, მხოლოდ შეთანხმებული სერვისის ოპერირებისთვის აუცილებელი ლიცენზია: ფაილის შენახვა და საჭირო ტექნიკური ასლების შექმნა, ფორმატის ტექნიკური ადაპტაცია, მოდერაციისთვის ნახვა და შეთანხმებული კურსის უფლებამოსილი მსმენელისთვის მიწოდება. საჯარო წინასწარი ნახვა მხოლოდ სპეციალურად შეთანხმებულ მასალას უნდა შეეხოს.","ეს არ არის უვადო, შეუზღუდავი, ნებისმიერი მიზნით გამოყენების ან საკუთრების გადაცემის მოთხოვნა. საბოლოო წერილობით შეთანხმებაში უნდა დასახელდეს კონკრეტული ნაწარმოები, გამოყენების სახეები, ტერიტორია, ვადა და ანაზღაურების წესი ან საცდელი უსასყიდლო გამოყენების მკაფიო პირობა. ტექნიკური მიმწოდებლის ჩართვა დასაშვები უნდა იყოს მხოლოდ იმავე აუცილებელი ფარგლებით და შესაბამისი ვალდებულებებით.","მასალის რეკლამაში ცალკე გამოყენება, შინაარსობრივი გადამუშავება, თარგმნა, სხვა პლატფორმაზე გაყიდვა ან AI მოდელის სწავლებისთვის გამოყენება ამ ოპერაციულ მონახაზში ნებადართული არ არის. ასეთი გამოყენება საჭიროებს ცალკე საფუძველს/შეთანხმებას. დემოს ველის მონიშვნა დასრულებულ წერილობით სალიცენზიო ხელშეკრულებად ავტომატურად არ უნდა ჩაითვალოს."]},{heading:"4. მოდერაცია და აკრძალული შინაარსი",paragraphs:["დაუშვებელია უკანონო ან სხვისი საავტორო, პირადი და სხვა უფლებების დამრღვევი შინაარსი, თაღლითობა, ძალადობის წაქეზება, სიძულვილის გაღვივება, მავნე პროგრამები და უსაფრთხოების საზიანო ფაილები. კურსის აღწერა, ავტორობა და დაპირებული შედეგები უნდა იყოს მართალი; არ შექმნათ ყალბი შეფასება, კვალიფიკაცია ან დასაქმების გარანტია.","ოპერატორის ადგილობრივი მოდერაცია ამოწმებს წარდგენილ მასალას გამოქვეყნებამდე, მაგრამ ვერ ცვლის ყველა უფლების იურიდიულ შემოწმებას. რეალურ მომსახურებაში უნდა განისაზღვროს უარის მიზეზი, გასწორების გზა, საჩივრის განხილვა და საგანგებო შეზღუდვა. ავტომატური დამტკიცების ან მოდერაციის დასრულების ვადა ამ დემოში არ არის დაპირებული."]},{heading:"5. უფლებების დარღვევის შეტყობინება და მოხსნა",paragraphs:["საჯარო გაშვებამდე უნდა არსებობდეს მოქმედი არხი დარღვევის შეტყობინებისთვის: შესაბამისი კურსის/გაკვეთილის იდენტიფიკაცია, უფლებისა და პრეტენზიის საფუძვლის აღწერა და პასუხისთვის აუცილებელი საკონტაქტო მონაცემები. რეალური არხი ჯერ არ არის მოწოდებული; ადგილობრივ ტესტში აცნობეთ დემოს გამშვებ პირს. თავიდანვე ნუ მოითხოვთ ზედმეტ პირად დოკუმენტებს.","საჭიროა მტკიცებულების დაცვა, რისკის შეფასება, საჭიროებისას წვდომის შეზღუდვა, ავტორისთვის ინფორმირება და დასაბუთებული გადახედვის შესაძლებლობა, კანონიერი გამონაკლისების გათვალისწინებით. შუალედური მიმწოდებლის შესაძლო პასუხისმგებლობის შეზღუდვა ავტომატურად არ უნდა იქნეს ნავარაუდევი; რეალური როლი ცალკე უნდა შეფასდეს."]},{heading:"6. ფასი, შემოსავალი, გადახდა და გადასახადები — არ არის კონფიგურირებული",paragraphs:["შემოსავლის განაწილების პროცენტი, საკომისიო, ფასდაკლების უფლებამოსილება, დაბრუნებისა და დავის ხარჯების განაწილება, ანგარიშსწორების ვალუტა, გრაფიკი, მინიმალური თანხა და საგადასახადო პასუხისმგებლობები ჯერ არ არის შეთანხმებული. დემოში გადახდები და შემოსავლის განაწილება არ მუშაობს; ფასის ველის შევსება ან ადგილობრივი წვდომის მინიჭება ანაზღაურების დაპირებას არ ქმნის.","ფასიანი გამოცემის რეჟიმი არ უნდა ჩაირთოს წერილობითი ხელშეკრულების, რეალური თანხის მიმღების/მოვაჭრის როლის, შერჩეული გადახდის პროვაიდერისა და ბუღალტრული პროცესის განსაზღვრამდე. ოპერატორისა და ინსტრუქტორის რეგისტრაციის, დეკლარირების, შესაძლო დაკავებისა და სხვა გადასახადების საკითხები ბუღალტერმა რეალური ურთიერთობის მიხედვით უნდა შეაფასოს; ამ ტექსტში არ არის დადგენილი საგადასახადო განაკვეთი ან შეღავათი."]},{heading:"7. შეწყვეტა და უკვე მინიჭებული წვდომა",paragraphs:["საბოლოო შეთანხმებამ უნდა განსაზღვროს მოხსნის მოთხოვნა, ახალი ჩარიცხვების შეჩერება, ფაილის დაბრუნება/წაშლა და აუცილებელი ასლების შეზღუდული ვადა. არსებული მსმენელის შეთანხმებული წვდომა და კანონიერი მოთხოვნები ისე უნდა მოწესრიგდეს, რომ არ შეიქმნას ავტორის განუსაზღვრელი ლიცენზია ან მომხმარებლის უფლების თვითნებური გაუქმება.","დემოსთვის არ არის დაპირებული სამუდამო ჰოსტინგი, ავტომატური ექსპორტი ან ავტომატური წაშლა. პილოტის შემდეგ საცდელი ფაილების ბედს ოპერატორი და ავტორი წინასწარ უნდ
